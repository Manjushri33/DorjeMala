name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Copy the web app into the APK assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          if [ -d imajes ]; then cp -r imajes android/app/src/main/assets/; fi
          ls -la android/app/src/main/assets

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/DorjeMala-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DorjeMala-apk
          path: out/*.apk
          retention-days: 90

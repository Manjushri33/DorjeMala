name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.html'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner ships a Gradle newer than the Android plugin supports,
      # so the version is pinned here instead of relying on what is installed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the web app into the APK assets
        run: |
          mkdir -p android/app/src/main/assets
          # app.html is the application itself; index.html at the repository
          # root is the landing page and has no place inside the APK.
          cp app.html android/app/src/main/assets/index.html
          # The calendar thangkas are ordinary files the app loads by path,
          # so they must travel with the APK. imajes/ is the source folder and
          # is deliberately left out.
          if [ -d uploads ]; then cp -r uploads android/app/src/main/assets/; fi
          # The page links these; without them the WebView logs a 404 on every
          # start. They cost a few kilobytes.
          cp manifest.json icon.svg icon-192.png icon-512.png apple-touch-icon.png \
             android/app/src/main/assets/
          du -sh android/app/src/main/assets

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/DorjeMala.apk
          ls -la out

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DorjeMala-apk
          path: out/DorjeMala.apk
          retention-days: 90

      # Published under a fixed tag so the download link never changes.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/DorjeMala.apk \
            --title "DorjeMala — latest APK" \
            --notes "Built automatically from the current version of the app. Build #${{ github.run_number }}."

apply plugin: 'com.android.application'

android {
    namespace 'com.dorjemala.mala'
    compileSdk 34

    defaultConfig {
        applicationId "com.dorjemala.mala"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.2"
    }

    // A fixed key, kept in the repository on purpose: the app is installed by hand,
    // not through Google Play. Without a stable key every build would be signed
    // differently and could not update the previous install.
    signingConfigs {
        release {
            storeFile file("../keystore/dorjemala.jks")
            storePassword "dorjemala"
            keyAlias "dorjemala"
            keyPassword "dorjemala"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Serves the app over an internal https address so the WebView behaves
    // like a normal browser: blobs, storage and origins all work as expected.
    implementation 'androidx.webkit:webkit:1.11.0'
}

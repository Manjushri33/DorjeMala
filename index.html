<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DorjeMala — лічильник мантр</title>
<meta name="description" content="Лічильник мантр для буддійської практики: накопичення, ретрити й тибетський календар. Працює без інтернету, дані залишаються на пристрої.">
<meta name="theme-color" content="#12121a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DorjeMala">
<meta property="og:title" content="DorjeMala — лічильник мантр">
<meta property="og:description" content="Лічильник мантр для буддійської практики: накопичення, ретрити й тибетський календар.">
<meta property="og:image" content="icon-512.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0b0a10}
  body{
    min-height:100dvh;color:#f6f4fb;
    font:400 15px/1.5 Manrope,system-ui,sans-serif;
    background:linear-gradient(180deg,#100e18,#0b0a10);
    display:flex;flex-direction:column;align-items:center;
    padding:calc(28px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
  }
  .glow{position:fixed;left:-20%;right:-20%;top:-8%;height:52%;pointer-events:none;
    background:radial-gradient(55% 55% at 50% 30%,rgba(201,168,106,.13),transparent 70%);
    animation:breathe 9s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
  main{width:100%;max-width:400px;position:relative;display:flex;flex-direction:column;
    flex:1;justify-content:center}
  .lang{position:absolute;top:-6px;right:0;font:600 12px/1 Manrope,sans-serif;
    color:rgba(232,230,240,.7);padding:9px 15px;border-radius:20px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer}
  .top{text-align:center;padding-top:14px}
  .top img{width:88px;height:88px;border-radius:24px;animation:breathe 6s ease-in-out infinite}
  h1{font:700 27px/1.1 Manrope,sans-serif;letter-spacing:.3px;margin:14px 0 0}
  h1 span{color:#e0c48a}
  .sub{font:italic 500 15.5px/1.35 'Cormorant Garamond',serif;color:rgba(224,196,138,.85);margin-top:5px}
  ul{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
  li{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:16px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
  .ic{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:17px;color:#e0c48a;border:1px solid rgba(201,168,106,.28);
    background:radial-gradient(circle at 35% 30%,rgba(201,168,106,.22),rgba(201,168,106,.08))}
  .t{font:700 14.5px/1.25 Manrope,sans-serif;color:#f2f0f8}
  .d{font:400 11.5px/1.45 Manrope,sans-serif;color:rgba(232,230,240,.55);margin-top:3px;text-wrap:pretty}
  .actions{margin-top:28px}
  .cta{display:block;width:100%;border:0;padding:16px;border-radius:17px;
    background:linear-gradient(135deg,#d8b578,#c9a86a);color:#221a08;
    font:700 15.5px/1 Manrope,sans-serif;text-align:center;text-decoration:none;cursor:pointer;
    box-shadow:0 6px 22px rgba(201,168,106,.32);transition:transform .12s}
  .cta:active{transform:scale(.97)}
  .hint{font:400 12.5px/1.5 Manrope,sans-serif;color:rgba(232,230,240,.5);
    margin-top:12px;text-align:center;text-wrap:pretty}
  .hint b{color:rgba(232,230,240,.8);font-weight:600}
  .alt{display:block;margin-top:12px;padding:11px;text-align:center;text-decoration:none;
    font:600 13.5px/1 Manrope,sans-serif;color:rgba(224,196,138,.85)}
  .foot{margin-top:16px;text-align:center;font:400 12px/1.6 Manrope,sans-serif;color:rgba(232,230,240,.38)}
  .foot a{color:rgba(232,230,240,.55);text-decoration:none;border-bottom:1px solid rgba(232,230,240,.18)}
  .privacy{margin-top:14px;text-align:center;font:400 12px/1.5 Manrope,sans-serif;color:rgba(232,230,240,.42)}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <div class="lang" id="lang">EN</div>

  <div class="top">
    <img src="icon-512.png" width="88" height="88" alt="DorjeMala">
    <h1>Dorje<span>Mala</span></h1>
    <div class="sub" id="sub"></div>
  </div>

  <ul id="rows"></ul>
  <div class="privacy" id="privacy"></div>

  <div class="actions">
    <button class="cta" id="cta"></button>
    <div class="hint" id="hint"></div>
    <a class="alt" id="alt" href="app.html"></a>
    <div class="foot">
      <a href="https://t.me/dorjemala_bot">Telegram</a> ·
      <a href="https://github.com/Manjushri33/DorjeMala/releases/download/latest/DorjeMala.apk">APK</a>
    </div>
  </div>
</main>

<script>
(function () {
  // Inside Telegram the landing page is pointless — the mini app opens the
  // application itself. Telegram passes its parameters in the URL hash.
  if (location.hash.indexOf('tgWebApp') >= 0 || window.TelegramWebviewProxy) {
    location.replace('app.html' + location.hash);
    return;
  }
  // Opened as an installed app: never show the landing.
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) { location.replace('app.html'); return; }

  var T = {
    uk: {
      sub: 'Лічильник мантр для щоденної практики',
      rows: [
        ['◉', 'Рахує на дотик', 'Торкаєшся екрана — телефон відповідає вібрацією. Дивитись на нього не треба.'],
        ['☸', 'Ретрити й календар', 'Власні цілі та дати, дні Гуру Рінпоче й дакіні, повні та нові місяці.'],
        ['▤', 'Статистика', 'Загальний підсумок, серія днів, історія по днях і мантрах.']
      ],
      privacy: 'Працює без інтернету. Дані залишаються на твоєму пристрої.',
      install: 'Встановити',
      open: 'Відкрити',
      openAlt: 'Відкрити без встановлення',
      hintIos: 'На iPhone: спершу відкрий, далі <b>«Поділитися» ↑</b> → <b>«На екран Домівки»</b>',
      hintMenu: 'Якщо кнопка не спрацювала: меню браузера <b>⋮</b> → «Встановити застосунок»',
      hintOk: 'Встановлення без завантаження файлів, займе кілька секунд.',
      done: 'Готово — іконка на робочому столі.'
    },
    en: {
      sub: 'A mantra counter for daily practice',
      rows: [
        ['◉', 'Counts by touch', 'Tap the screen and the phone answers with a short vibration. No need to look at it.'],
        ['☸', 'Retreats and calendar', 'Your own goals and dates, Guru Rinpoche and Dakini days, full and new moons.'],
        ['▤', 'Statistics', 'Lifetime total, day streak, history by day and by mantra.']
      ],
      privacy: 'Works offline. Everything stays on your device.',
      install: 'Install',
      open: 'Open',
      openAlt: 'Open without installing',
      hintIos: 'On iPhone: open it first, then <b>Share ↑</b> → <b>“Add to Home Screen”</b>',
      hintMenu: 'If the button does nothing: browser menu <b>⋮</b> → “Install app”',
      hintOk: 'Nothing is downloaded — it takes a couple of seconds.',
      done: 'Done — the icon is on your home screen.'
    }
  };

  var saved = null;
  try { saved = localStorage.getItem('dm_site_lang'); } catch (e) {}
  var lang = saved || (/^(uk|ru)/i.test(navigator.language || '') ? 'uk' : 'en');

  var ua = navigator.userAgent || '';
  var isIos = /iphone|ipad|ipod/i.test(ua) ||
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  var deferred = null, installed = false;
  var cta = document.getElementById('cta'), hint = document.getElementById('hint');

  function draw() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.getElementById('lang').textContent = lang === 'uk' ? 'EN' : 'УК';
    document.getElementById('sub').textContent = t.sub;
    document.getElementById('privacy').textContent = t.privacy;
    document.getElementById('alt').textContent = t.openAlt;
    document.getElementById('rows').innerHTML = t.rows.map(function (r) {
      return '<li><div class="ic">' + r[0] + '</div><div><div class="t">' +
             r[1] + '</div><div class="d">' + r[2] + '</div></div></li>';
    }).join('');

    if (installed)      { cta.textContent = t.open;    hint.innerHTML = t.done; }
    else if (deferred)  { cta.textContent = t.install; hint.innerHTML = t.hintOk; }
    else if (isIos)     { cta.textContent = t.open;    hint.innerHTML = t.hintIos; }
    else                { cta.textContent = t.install; hint.innerHTML = t.hintMenu; }
  }

  document.getElementById('lang').onclick = function () {
    lang = lang === 'uk' ? 'en' : 'uk';
    try { localStorage.setItem('dm_site_lang', lang); } catch (e) {}
    draw();
  };

  // Chrome fires this instead of showing its own bar; we hold it and put the
  // choice on our own button.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    draw();
  });

  window.addEventListener('appinstalled', function () {
    installed = true; deferred = null; draw();
  });

  cta.onclick = function () {
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; draw(); });
    } else {
      location.href = 'app.html';
    }
  };

  // Installability requires a service worker in control of the page.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }

  draw();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DorjeMala — лічильник мантр</title>
<meta name="description" content="Лічильник мантр, ретрити й буддійський календар — в одному застосунку. Працює без інтернету, дані залишаються на пристрої.">
<meta name="theme-color" content="#0a080d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="DorjeMala — лічильник мантр">
<meta property="og:description" content="Лічильник мантр, ретрити й буддійський календар — в одному застосунку.">
<meta property="og:image" content="icon-512.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap&subset=cyrillic,latin" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0a080d}
  :root{--gold:#d9b678;--gold-soft:#e8d3a8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  a{color:var(--gold);text-decoration:none}
  a:hover{color:var(--gold-soft)}
  ::selection{background:rgba(217,182,120,.28)}
  .dm-scroll{scrollbar-width:none;-ms-overflow-style:none}
  .dm-scroll::-webkit-scrollbar{display:none}
  @keyframes dm-breathe{0%,100%{transform:translateX(-50%) translateY(0) scale(1);opacity:.6}
    50%{transform:translateX(-50%) translateY(-8px) scale(1.04);opacity:.85}}
  @keyframes dm-spin{to{transform:rotate(360deg)}}

  body{color:#efe9f2;font-family:Manrope,system-ui,sans-serif;min-height:100vh;
    display:flex;justify-content:center}
  .page{width:100%;max-width:480px;position:relative;background:#0a080d;padding-bottom:132px}
  .hero{position:relative;overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%,#291d35 0%,#16111f 45%,#0a080d 100%)}
  .halo{position:absolute;top:-220px;left:50%;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle,rgba(217,182,120,.2) 0%,rgba(217,182,120,0) 64%);
    animation:dm-breathe 9s ease-in-out infinite;pointer-events:none}
  .bar{position:relative;padding:22px 22px 0;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(160deg,#1b1524,#0d0a12);
    border:1px solid rgba(217,182,120,.28);display:grid;place-items:center}
  /* A mala of beads turning around a vajra — the app's own mark, not a generic
     dot in a ring. Only the beads rotate; the vajra stays upright. */
  .mark i{position:relative;width:23px;height:23px;display:grid;place-items:center}
  .mark i .beads{position:absolute;inset:0;animation:dm-spin 44s linear infinite}
  .mark i .vajra{position:relative;width:13px;height:13px}
  .wordmark{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .wordmark span{color:var(--gold)}
  .langs{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
  .langs button{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:12px;
    font-weight:700;letter-spacing:.06em;padding:7px 12px;border-radius:999px;
    transition:all .18s ease;background:transparent;color:#9a94a8}
  .langs button.on{background:rgba(217,182,120,.16);color:var(--gold)}
  .top{position:relative;padding:40px 22px;text-align:center}
  .iconwrap{display:grid;place-items:center}
  .iconbox{position:relative;width:104px;height:104px;border-radius:30px;
    background:linear-gradient(165deg,#221a2d,#0e0a13);border:1px solid rgba(217,182,120,.3);
    box-shadow:0 22px 50px rgba(0,0,0,.6);overflow:hidden}
  .iconbox img{width:100%;height:100%;display:block}
  h1{margin:28px 0 0;font-size:38px;line-height:1.06;font-weight:800;
    letter-spacing:-.035em;text-wrap:balance}
  h1 em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    color:var(--gold);letter-spacing:-.005em}
  .lead{margin:18px auto 0;max-width:340px;font-size:16px;line-height:1.6;
    color:#a9a2b4;text-wrap:pretty}
  .chips{margin-top:30px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
    font-size:12.5px;color:#9a94a8}
  .chips span{padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.02)}
  .phonewrap{position:relative;padding:0 22px;display:flex;justify-content:center}
  .phone{width:238px;padding:9px 9px 0;border-radius:34px 34px 0 0;
    background:linear-gradient(165deg,rgba(217,182,120,.36),rgba(217,182,120,.06) 50%,rgba(255,255,255,.03));
    box-shadow:0 -10px 60px rgba(0,0,0,.5)}
  /* Real screenshots, 512×1060. The hero crops the top of the screen; the
     gallery shows a whole screen at once. */
  .phone .glass{border-radius:27px 27px 0 0;overflow:hidden;background:#100c16;height:300px}
  .phone .glass img{width:100%;height:auto;display:block}

  section{padding:56px 22px 0}
  .sechead{margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:23px;color:var(--gold)}
  .cards{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  article{display:flex;align-items:center;gap:16px;padding:22px 20px;border-radius:20px;
    background:linear-gradient(180deg,#16111e,#100c16);border:1px solid rgba(255,255,255,.055)}
  .bullet{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:rgba(217,182,120,.1);
    border:1px solid rgba(217,182,120,.24);display:grid;place-items:center}
  /* ◉ — a ring with a filled centre, the glyph the app itself uses. */
  .b1{width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);
    display:grid;place-items:center}
  .b1::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .b2{width:15px;height:8px;border-radius:8px 8px 0 0;background:var(--gold)}
  .b3{width:14px;height:14px;border-radius:50%;border:2px dotted var(--gold)}
  article h3{margin:2px 0 7px;font-size:17.5px;font-weight:800;letter-spacing:-.02em}
  article p{margin:0;font-size:15px;line-height:1.6;color:#a9a2b4;text-wrap:pretty}

  .inside{padding:56px 0 0}
  .inside .sechead{margin:0 22px}
  .gallery{margin-top:20px;display:flex;gap:14px;overflow-x:auto;padding:0 22px 4px;
    scroll-snap-type:x mandatory}
  .shot{flex:0 0 auto;width:186px;margin:0;scroll-snap-align:center}
  .shot img{width:186px;height:362px;border-radius:20px;
    border:1px solid rgba(255,255,255,.07);background:#100c16;cursor:zoom-in}
  .shot figcaption{margin-top:9px;font-size:12.5px;line-height:1.4;
    color:#948fa3;text-wrap:pretty}
  .dots{display:flex;justify-content:center;gap:7px;margin-top:16px}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16);
    transition:background .2s}
  .dots i.on{background:var(--gold)}
  /* Native dialog: Esc, backdrop and focus trapping come free. */
  #lb{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh}
  #lb::backdrop{background:rgba(6,5,9,.92)}
  #lb img{max-width:92vw;max-height:92vh;border-radius:14px;display:block;cursor:zoom-out}

  /* Same rhythm as the feature cards above: separate rounded cards, a round
     badge on the left, everything on one optical line. */
  .steps{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .step{display:flex;align-items:center;gap:16px;padding:22px 20px;border-radius:20px;
    background:linear-gradient(180deg,#16111e,#100c16);border:1px solid rgba(255,255,255,.055)}
  .step .n{flex:0 0 auto;width:40px;height:40px;border-radius:50%;
    background:rgba(217,182,120,.1);border:1px solid rgba(217,182,120,.24);
    display:grid;place-items:center;font-family:'Cormorant Garamond',serif;
    font-size:19px;line-height:1;color:var(--gold)}
  .step h4{margin:0 0 6px;font-size:17.5px;font-weight:800;letter-spacing:-.02em}
  .step p{margin:0;font-size:15px;line-height:1.6;color:#a9a2b4;text-wrap:pretty}

  .quote{position:relative;overflow:hidden;border-radius:24px;
    border:1px solid rgba(217,182,120,.2);
    background:radial-gradient(110% 130% at 50% 0%,#291d35 0%,#16111f 55%,#0d0a12 100%);
    padding:44px 26px;text-align:center}
  .quote .halo2{position:absolute;top:-140px;left:50%;transform:translateX(-50%);
    width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(217,182,120,.16) 0%,rgba(217,182,120,0) 65%);
    pointer-events:none}
  .quote p{position:relative;margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:26px;line-height:1.32;color:#efe9f2;text-wrap:balance}

  footer{margin-top:44px;border-top:1px solid rgba(255,255,255,.06)}
  .foot{padding:22px;display:flex;align-items:center;justify-content:space-between;
    font-size:13px;color:#948fa3}
  .foot a{color:#948fa3}

  /* Desktop only: the app is for a phone, so hand the page over to one.
     Hidden below 900px, where the visitor is already holding the phone. */
  .qr{display:none}
  @media (min-width:1140px){
    .qr{display:flex;position:fixed;right:28px;bottom:28px;z-index:25;gap:14px;
      align-items:center;padding:14px;border-radius:18px;
      background:linear-gradient(180deg,#16111e,#100c16);
      border:1px solid rgba(255,255,255,.07);box-shadow:0 18px 46px rgba(0,0,0,.55)}
    .qr .code{width:104px;height:104px;border-radius:10px;background:var(--gold);
      padding:8px;flex:none}
    .qr .code img{width:100%;height:100%;display:block}
    .qr .say{max-width:158px;font-size:12.5px;line-height:1.5;color:#a9a2b4;text-wrap:pretty}
    .qr .say b{display:block;color:#efe9f2;font-size:13.5px;font-weight:800;margin-bottom:4px}
  }

  .ctabar{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;
    align-items:center;gap:9px;padding:14px 22px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(10,8,13,0) 0%,rgba(10,8,13,.92) 30%,#0a080d 100%);
    pointer-events:none;z-index:20}
  /* Two honest routes side by side: the installed app updates itself, the file
     does not. The note under them says exactly that, in one line. */
  .ctarow{display:flex;gap:9px;width:100%;max-width:436px}
  .ctanote{pointer-events:auto;max-width:436px;font-size:11.5px;line-height:1.45;
    color:#948fa3;text-align:center;text-wrap:pretty}
  .cta.second{background:transparent;color:var(--gold);border:1px solid rgba(217,182,120,.34);
    box-shadow:none;font-weight:700;font-size:15px}
  .cta.second:hover{box-shadow:none;background:rgba(217,182,120,.07);color:var(--gold-soft)}
  .cta{pointer-events:auto;flex:1;width:100%;max-width:436px;min-height:58px;display:flex;
    align-items:center;justify-content:center;gap:10px;border-radius:16px;
    background:linear-gradient(180deg,#e8cd97,#cfa863);color:#1a1208;font-size:17px;
    font-weight:800;letter-spacing:-.01em;box-shadow:0 12px 34px rgba(217,182,120,.26);
    transition:box-shadow .2s,transform .12s}
  .cta:hover{box-shadow:0 16px 44px rgba(217,182,120,.38);color:#1a1208}
  .cta:active{transform:scale(.985)}

</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="halo"></div>

    <div class="bar">
      <div class="brand">
        <div class="mark"><i>
          <svg class="beads" viewBox="0 0 23 23" fill="var(--gold)" aria-hidden="true">
            <circle cx="11.5" cy="1.6" r="1.05"/><circle cx="18.5" cy="4.5" r="1.05"/>
            <circle cx="21.4" cy="11.5" r="1.05"/><circle cx="18.5" cy="18.5" r="1.05"/>
            <circle cx="11.5" cy="21.4" r="1.05"/><circle cx="4.5" cy="18.5" r="1.05"/>
            <circle cx="1.6" cy="11.5" r="1.05"/><circle cx="4.5" cy="4.5" r="1.05"/>
          </svg>
          <svg class="vajra" viewBox="0 0 100 100" fill="none" stroke="var(--gold)"
               stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M50,42 L50,26"/><path d="M50,44 C41,36 43,28 50,26"/>
            <path d="M50,44 C59,36 57,28 50,26"/>
            <path d="M50,58 L50,74"/><path d="M50,56 C41,64 43,72 50,74"/>
            <path d="M50,56 C59,64 57,72 50,74"/>
            <path d="M42,50 L26,50"/><path d="M44,50 C36,41 28,43 26,50"/>
            <path d="M44,50 C36,59 28,57 26,50"/>
            <path d="M58,50 L74,50"/><path d="M56,50 C64,41 72,43 74,50"/>
            <path d="M56,50 C64,59 72,57 74,50"/>
            <circle cx="50" cy="50" r="7" fill="var(--gold)" stroke="none"/>
          </svg>
        </i></div>
        <span class="wordmark">Dorje<span>Mala</span></span>
      </div>
      <div class="langs">
        <button type="button" id="uk">UK</button>
        <button type="button" id="en">EN</button>
      </div>
    </div>

    <div class="top">
      <div class="iconwrap">
        <div class="iconbox"><img src="icon-512.png" width="104" height="104" alt="DorjeMala"></div>
      </div>
      <h1><span data-t="h1a"></span> <em data-t="h1b"></em></h1>
      <p class="lead" data-t="lead"></p>
      <div class="chips">
        <span data-t="chip1"></span><span data-t="chip2"></span><span data-t="chip3"></span>
      </div>
    </div>

    <div class="phonewrap">
      <div class="phone"><div class="glass">
        <img src="shots/home.jpg" width="512" height="1060" alt="">
      </div></div>
    </div>
  </div>

  <section>
    <p class="sechead" data-t="featTitle"></p>
    <div class="cards">
      <article>
        <div class="bullet"><div class="b1"></div></div>
        <div><h3 data-t="f1t"></h3><p data-t="f1d"></p></div>
      </article>
      <article>
        <div class="bullet"><div class="b2"></div></div>
        <div><h3 data-t="f2t"></h3><p data-t="f2d"></p></div>
      </article>
      <article>
        <div class="bullet"><div class="b3"></div></div>
        <div><h3 data-t="f3t"></h3><p data-t="f3d"></p></div>
      </article>
    </div>
  </section>

  <section class="inside">
    <p class="sechead" data-t="insideTitle"></p>
    <!-- Same order as the app's own tab bar: practice, retreats, statistics,
         calendar. Tapping a shot opens it full size in a native <dialog>. -->
    <div class="gallery dm-scroll" id="gallery">
      <figure class="shot"><img src="shots/counter.jpg" width="512" height="1060" loading="lazy">
        <figcaption data-t="capCounter"></figcaption></figure>
      <figure class="shot"><img src="shots/retreat.jpg" width="512" height="1060" loading="lazy">
        <figcaption data-t="capRetreat"></figcaption></figure>
      <figure class="shot"><img src="shots/stats.jpg" width="512" height="1060" loading="lazy">
        <figcaption data-t="capStats"></figcaption></figure>
      <figure class="shot"><img src="shots/calendar.jpg" width="512" height="1060" loading="lazy">
        <figcaption data-t="capCalendar"></figcaption></figure>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>

  <dialog id="lb"></dialog>

  <section>
    <p class="sechead" data-t="stepsTitle"></p>
    <div class="steps">
      <div class="step"><div class="n">1</div>
        <div><h4 data-t="s1t"></h4><p data-t="s1d"></p></div></div>
      <div class="step"><div class="n">2</div>
        <div><h4 data-t="s2t"></h4><p data-t="s2d"></p></div></div>
      <div class="step"><div class="n">3</div>
        <div><h4 data-t="s3t"></h4><p data-t="s3d"></p></div></div>
    </div>
  </section>

  <section>
    <div class="quote">
      <div class="halo2"></div>
      <p data-t="quote"></p>
    </div>
  </section>

  <footer>
    <div class="foot">
      <span>DorjeMala · 2026</span>
    </div>
  </footer>

  <aside class="qr">
    <div class="code"><img src="qr.svg" width="104" height="104" alt=""></div>
    <div class="say"><b data-t="qrT"></b><span data-t="qrD"></span></div>
  </aside>

  <div class="ctabar">
    <div class="ctarow">
      <a class="cta" id="install" href="app.html"></a>
    </div>
    <div class="ctanote" id="ctanote"></div>
  </div>
</div>

<script>
(function () {
  // Inside Telegram the landing is pointless — the mini app must open the app
  // itself. Telegram passes its parameters in the URL hash.
  if (location.hash.indexOf('tgWebApp') >= 0 || window.TelegramWebviewProxy) {
    location.replace('app.html' + location.hash);
    return;
  }

  var COPY = {
    uk: {
      h1a: 'Твій супутник у', h1b: 'мантра-практиці',
      lead: 'Лічильник мантр, ретрити й буддійський календар — в одному застосунку.',
      chip1: 'Без інтернету', chip2: 'Без акаунта', chip3: 'Без реклами',
      featTitle: 'Три речі, які тримають практику',
      f1t: 'Лічильник мантр', f1d: 'Рахуй повторення мантр і зберігай свої накопичення.',
      f2t: 'Ретрити', f2d: 'Створюй ретрити, стеж за щоденною практикою та прогресом.',
      f3t: 'Буддійський календар', f3d: 'Переглядай важливі буддійські дати, дні практик і свят.',
      insideTitle: 'Всередині',
      capCounter: 'Лічильник. Тханка на весь екран, під нею — прочитане і позиція в малі.',
      capRetreat: 'Ретрит. Кілька мантр, спільний строк, прогрес по кожній.',
      capStats: 'Статистика мантри. Два тижні, пів року, історія по днях.',
      capCalendar: 'Календар. Особливі дні позначені, поруч — найближчі.',
      stepsTitle: 'Встановлення — три кроки',
      s1t: 'Натисни «Встановити»', s1d: 'Браузер запитає підтвердження. Нічого не завантажується, файлів шукати не треба.',
      s2t: 'Іконка на екрані', s2d: 'Застосунок відкривається як звичайний, на весь екран. Оновлення приходять самі.',
      s3t: 'Обери мову', s3d: 'При першому запуску застосунок спитає мову й запропонує тур, який створить першу мантру.',
      quote: 'Працює без інтернету. Дані залишаються на твоєму пристрої.',
      install: 'Встановити', open: 'Відкрити',
      ctanote: 'Без завантажень і без реєстрації.',
      qrT: 'Це для телефона', qrD: 'Наведи камеру — і відкриєш сторінку там.',
    },
    en: {
      h1a: 'Your companion in', h1b: 'mantra practice',
      lead: 'A mantra counter, retreats and the Buddhist calendar — in one app.',
      chip1: 'Works offline', chip2: 'No account', chip3: 'No ads',
      featTitle: 'Three things that hold a practice',
      f1t: 'Mantra counter', f1d: 'Count mantra repetitions and keep your accumulations.',
      f2t: 'Retreats', f2d: 'Create retreats and follow your daily practice and progress.',
      f3t: 'Buddhist calendar', f3d: 'See important Buddhist dates, practice days and holidays.',
      insideTitle: 'Inside',
      capCounter: 'The counter. A thangka full screen, the count and the mala position under it.',
      capRetreat: 'A retreat. Several mantras, one deadline, progress on each.',
      capStats: 'Statistics for one mantra. Two weeks, six months, day by day.',
      capCalendar: 'The calendar. Special days marked, the next ones listed below.',
      stepsTitle: 'Install in three steps',
      s1t: 'Tap “Install”', s1d: 'The browser asks you to confirm. Nothing is downloaded, no file to hunt for.',
      s2t: 'An icon appears', s2d: 'It opens like any other app, full screen. Updates arrive on their own.',
      s3t: 'Pick a language', s3d: 'On first launch the app asks for a language and offers a tour that creates your first mantra.',
      quote: 'Works offline. Your data stays on your device.',
      install: 'Install', open: 'Open',
      ctanote: 'No downloads, no sign-up.',
      qrT: 'This one is for a phone', qrD: 'Point your camera to open the page there.',
    }
  };

  var deferred = null;
  var saved = null;
  try { saved = localStorage.getItem('dm_site_lang'); } catch (e) {}
  var lang = saved || (/^(uk|ru)/i.test(navigator.language || '') ? 'uk' : 'en');

  function draw() {
    var t = COPY[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      el.textContent = t[el.getAttribute('data-t')];
    });
    // Installable — offer the install. Not installable (iPhone, Firefox, a
    // desktop that already has it) — offer to just open it, rather than a
    // button that would do nothing.
    var canInstall = !!deferred;
    document.getElementById('install').textContent = canInstall ? t.install : t.open;
    document.getElementById('ctanote').textContent = canInstall ? t.ctanote : '';
    document.getElementById('uk').className = lang === 'uk' ? 'on' : '';
    document.getElementById('en').className = lang === 'en' ? 'on' : '';
  }

  // Chrome only offers installation once a service worker controls the page,
  // and it hands the prompt to us instead of showing its own. Without both of
  // these the button silently degrades to "open", which is what the whole page
  // is trying not to be.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }

  var installBtn = document.getElementById('install');

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    draw();
  });

  window.addEventListener('appinstalled', function () {
    deferred = null;
    draw();
  });

  installBtn.onclick = function (e) {
    if (!deferred) return;          // nothing to prompt — follow the href
    e.preventDefault();
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; draw(); });
  };

  // Gallery: dots track the scroll, a tap opens the shot full size.
  var gallery = document.getElementById('gallery');
  var dots = document.getElementById('dots');
  var shots = [].slice.call(gallery.querySelectorAll('img'));
  shots.forEach(function () { dots.appendChild(document.createElement('i')); });

  function markDot() {
    var i = Math.round(gallery.scrollLeft / (gallery.scrollWidth / shots.length));
    [].forEach.call(dots.children, function (d, n) { d.className = n === i ? 'on' : ''; });
  }
  gallery.addEventListener('scroll', markDot, { passive: true });
  markDot();

  var lb = document.getElementById('lb');
  gallery.addEventListener('click', function (e) {
    if (e.target.tagName !== 'IMG') return;
    lb.innerHTML = '<img src="' + e.target.src + '" alt="">';
    lb.showModal();
  });
  lb.addEventListener('click', function () { lb.close(); });

  function pick(l) {
    return function () {
      lang = l;
      try { localStorage.setItem('dm_site_lang', l); } catch (e) {}
      draw();
    };
  }
  document.getElementById('uk').onclick = pick('uk');
  document.getElementById('en').onclick = pick('en');

  draw();
})();
</script>
</body>
</html>

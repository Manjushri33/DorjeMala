<style>
  /* ── The world ───────────────────────────────────────────────────────────
     Lacquered wood, parchment and brass. Everything sits either on the ground
     or on an oak surface; nothing floats. Corners are 4px because a shrine is
     joinery, not a rounded card. The one inversion on the page is the closing
     block, set on parchment — a page from the book, and the only place the
     values flip.
     Two typefaces, both carrying Cyrillic: Cormorant Garamond sets every
     display line and every small-caps label, Literata carries the reading text.
     No sans-serif anywhere.                                                  */
  :root{
    --ground:#1C1714; --oak:#251E19; --leather:#3D332B; --rule:#4A3F35;
    --parchment:#E8DFD4; --ink:#9C8B7A; --brass:#C9A962; --brass-lit:#E3C98D;
    --seal:#8B2635;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ground)}
  body{color:var(--parchment);font:400 16.5px/1.62 Literata,Georgia,serif;
    min-height:100vh;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased}
  ::selection{background:rgba(201,169,98,.3)}
  .page{width:100%;max-width:520px;position:relative;padding-bottom:128px}

  /* Small caps in Cormorant carry every label; Cinzel has no Cyrillic. */
  .label{font:500 11.5px/1 'Cormorant Garamond',serif;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink)}

  /* ── Header ── */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:24px 26px 0}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:34px;height:34px;display:block;color:var(--brass);fill:currentColor}
  .colomark{width:30px;height:30px;display:inline-block;color:var(--brass);
    fill:currentColor;opacity:.62}
  .beads{transform-origin:50% 50%;animation:turn 64s linear infinite}
  @keyframes turn{to{transform:rotate(360deg)}}
  .wordmark{font:500 20px/1 'Cormorant Garamond',serif;letter-spacing:.02em}
  .wordmark span{color:var(--brass)}
  .langs{display:flex;gap:14px}
  .langs button{appearance:none;background:0;border:0;cursor:pointer;padding:4px 0;
    font:500 11.5px/1 'Cormorant Garamond',serif;letter-spacing:.2em;
    color:var(--ink);border-bottom:1px solid transparent}
  .langs button.on{color:var(--brass);border-bottom-color:var(--brass)}

  /* ── Hero ── */
  .hero{padding:44px 26px 0;text-align:center}
  h1{margin:0;font:400 44px/1.08 'Cormorant Garamond',serif;letter-spacing:-.01em}
  h1 em{display:block;font-style:italic;color:var(--brass)}
  /* Two even lines. A narrower measure sent the em dash to a third line on
     its own, which is the ugliest break a sentence can make. */
  .lead{margin:20px auto 0;font-size:16px;line-height:1.72;
    color:var(--ink);text-wrap:balance;hanging-punctuation:none}
  .chips{margin-top:26px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  .chips span{position:relative}
  .chips span+span::before{content:"";position:absolute;left:-11px;top:50%;
    width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:var(--rule)}

  /* ── The arch ────────────────────────────────────────────────────────────
     A thangka belongs in a niche, not behind text. This is the page's one
     large gesture: the counter screen, whole, framed, lit from the top. */
  .niche{margin:40px auto 0;width:100%;position:relative;cursor:pointer;
    user-select:none;-webkit-user-select:none}
  .niche .frame{border:1px solid var(--rule);border-radius:999px 999px 4px 4px;
    padding:7px;background:linear-gradient(180deg,#33291f,#241d18)}
  .niche img{display:block;width:100%;height:auto;border-radius:999px 999px 0 0;
    filter:sepia(.1) saturate(.96)}
  /* Tapping the niche counts, exactly as it does in the app. This is the one
     place a visitor can feel the product before installing it. */
  .tally{background:#0f0c0a;border-radius:0 0 2px 2px;padding:14px 14px 16px;
    text-align:center}
  .tally .n{font:300 46px/1 Literata,Georgia,serif;letter-spacing:.01em;
    color:var(--parchment);font-variant-numeric:lining-nums tabular-nums;
    font-feature-settings:'lnum' 1,'tnum' 1}
  .tally .sub{margin-top:16px;font:400 9.5px/1 Literata,Georgia,serif;
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
    font-variant-numeric:lining-nums tabular-nums;
    font-feature-settings:'lnum' 1,'tnum' 1}
  /* 108 beads, one per recitation. They wrap into rows; a full round lights
     every one of them. */
  /* One row of 27, the wrist mala: four times round makes 108. One bead per
     tap, so the very first tap answers. */
  .mala{display:flex;justify-content:center;gap:4px;margin-top:12px}
  .mala i{width:5px;height:5px;border-radius:50%;background:rgba(232,223,212,.15);
    transition:background .2s ease}
  .mala i.on{background:var(--brass)}
  .niche .hint{margin-top:14px;text-align:center;transition:opacity .8s ease}
  /* Vignette, so the image sits in the wood instead of on top of it. */
  .niche .frame::after{content:"";position:absolute;inset:7px;pointer-events:none;
    border-radius:999px 999px 2px 2px;
    box-shadow:inset 0 0 46px 10px rgba(20,16,13,.5)}
  .niche figcaption{margin-top:16px;text-align:center}

  /* ── Sections ── */
  section{padding:64px 26px 0}
  .sechead{margin:0 0 4px;font:italic 400 27px/1.25 'Cormorant Garamond',serif;
    color:var(--parchment)}
  .sechead{margin-bottom:24px}

  /* Features: on the ground, divided by brass hairlines. Not cards. */
  .feat{display:flex;gap:20px;align-items:baseline;padding:22px 0;
    border-top:1px solid var(--rule)}
  .feat:last-of-type{border-bottom:1px solid var(--rule)}
  .feat .g{flex:0 0 auto;width:22px;text-align:center;font-size:17px;
    color:var(--brass);line-height:1}
  .feat h3{margin:0 0 6px;font:500 21px/1.2 'Cormorant Garamond',serif;
    letter-spacing:.005em}
  .feat p{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink);text-wrap:pretty}

  /* Gallery: the same arch, small, four times. */
  .inside{padding:64px 0 0}
  .inside .sechead{margin-left:26px;margin-right:26px}
  .gallery{display:flex;gap:16px;overflow-x:auto;padding:0 26px 4px;
    scroll-snap-type:x mandatory;scrollbar-width:none}
  .gallery::-webkit-scrollbar{display:none}
  .shot{flex:0 0 auto;width:182px;margin:0;scroll-snap-align:center}
  .shot .frame{border:1px solid var(--rule);border-radius:91px 91px 4px 4px;
    padding:5px;background:linear-gradient(180deg,#2e251d,#221b16)}
  .shot img{display:block;width:100%;height:352px;object-fit:cover;
    object-position:top;border-radius:87px 87px 2px 2px;cursor:zoom-in;
    filter:sepia(.1) saturate(.95)}
  .shot figcaption{margin-top:13px;text-align:center}
  .dots{display:flex;justify-content:center;gap:9px;margin-top:22px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);
    transition:background .4s ease}
  .dots i.on{background:var(--brass)}

  /* Steps: Roman numerals, the scholarly register. */
  .step{display:flex;gap:20px;align-items:baseline;padding:22px 0;
    border-top:1px solid var(--rule)}
  .step:last-of-type{border-bottom:1px solid var(--rule)}
  .step .n{flex:0 0 auto;width:22px;text-align:center;color:var(--brass);
    font:400 19px/1 'Cormorant Garamond',serif;letter-spacing:.04em}
  .step h4{margin:0 0 6px;font:500 21px/1.2 'Cormorant Garamond',serif}
  .step p{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink);text-wrap:pretty}

  /* A colophon: the printer's device, then the closing line. The mark is the
     app's own, set small and dim — the way a book signs off. */
  .leaf{margin:48px 26px 0;text-align:center}
  .leaf p{margin:15px 0 0;font:italic 400 21px/1.5 'Cormorant Garamond',serif;
    color:var(--ink);text-wrap:balance}
  /* Two brass rules of unequal length under the mark, the shorter one centred:
     a tail-piece, not a divider. */
  .leaf::after{content:"";display:block;width:20px;height:1px;margin:18px auto 0;
    background:var(--brass);opacity:.5}

  /* ── The act ── */
  .bar{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;
    align-items:center;gap:11px;padding:18px 26px calc(20px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(28,23,20,0),rgba(28,23,20,.94) 32%,var(--ground));
    pointer-events:none;z-index:20}
  .cta{pointer-events:auto;width:100%;max-width:468px;min-height:56px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    background:var(--brass);color:#221b12;text-decoration:none;
    font:500 17px/1 'Cormorant Garamond',serif;letter-spacing:.09em;
    text-transform:uppercase;transition:background .35s ease}
  .cta:hover{background:var(--brass-lit)}
  .cta:active{background:var(--brass-lit)}
  .barnote{pointer-events:auto;max-width:468px;text-align:center;
    font-size:12.5px;line-height:1.45;color:var(--ink)}

  /* Full-size viewing, native dialog. */
  #lb{border:0;padding:0;background:0;max-width:100vw;max-height:100vh}
  #lb::backdrop{background:rgba(20,16,13,.95)}
  #lb img{max-width:92vw;max-height:92vh;display:block;border-radius:4px;cursor:zoom-out}

  /* Desktop: the column keeps its measure, the wood fills the room. */
  @media (min-width:900px){
    body{background:radial-gradient(120% 70% at 50% 0%,#241d18,var(--ground) 62%)}
    .page{max-width:560px}
  }
</style>
</head>

<div class="page">

  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><use href="#dm-mark"/></svg>
      <span class="wordmark">Dorje<span>Mala</span></span>

    <div class="langs">

      <button type="button" id="en">EN</button>

  <div class="hero">

      <div><h3 data-t="f2t"></h3><p data-t="f2d"></p></div></div>
    <div class="feat"><div class="g">☸</div>
      <div><h3 data-t="f3t"></h3><p data-t="f3d"></p></div></div>
  </section>

  <section class="inside">
    <h2 class="sechead" data-t="insideTitle"></h2>
    <div class="gallery" id="gallery">
      <figure class="shot"><div class="frame">
        <img src="shots/home.jpg" width="512" height="1060" loading="lazy" alt=""></div>
        <figcaption class="label" data-t="capHome"></figcaption></figure>
      <figure class="shot"><div class="frame">

<script>
(function () {
  if (location.hash.indexOf('tgWebApp') >= 0 || window.TelegramWebviewProxy) {
    location.replace('app.html' + location.hash);
    return;
  }

  var COPY = {
    uk: {
      h1a: 'Твій супутник у', h1b: 'мантра-практиці',
      lead: 'Лічильник мантр, ретрити й буддійський календар — в одному застосунку.',
      chip1: 'Без інтернету', chip2: 'Без акаунта', chip3: 'Без реклами',
      tapHint: 'Торкнись — порахуй',
      featTitle: 'Три речі, які тримають практику',
      f1t: 'Лічильник мантр', f1d: 'Рахуй повторення мантр і зберігай свої накопичення.',
      f2t: 'Ретрити', f2d: 'Створюй ретрити, стеж за щоденною практикою та прогресом.',
      f3t: 'Буддійський календар', f3d: 'Переглядай важливі буддійські дати, дні практик і свят.',
      insideTitle: 'Всередині',
      capHome: 'Практика', capRetreat: 'Ретрит', capStats: 'Статистика', capCalendar: 'Календар',
      stepsTitle: 'Встановлення — три кроки',
      s1t: 'Натисни «Встановити»', s1d: 'Браузер запитає підтвердження. Нічого не завантажується, файлів шукати не треба.',
      s2t: 'Іконка на екрані', s2d: 'Застосунок відкривається як звичайний, на весь екран. Оновлення приходять самі.',
      s3t: 'Обери мову', s3d: 'При першому запуску застосунок спитає мову й запропонує тур, який створить першу мантру.',
      quote: 'Працює без інтернету. Дані залишаються на твоєму пристрої.',
      install: 'Встановити', open: 'Відкрити', round: 'мала',
      barnote: 'Без завантажень і без реєстрації.'
    },
    en: {
      h1a: 'Your companion in', h1b: 'mantra practice',
      lead: 'A mantra counter, retreats and the Buddhist calendar — in one app.',
      chip1: 'Works offline', chip2: 'No account', chip3: 'No ads',
      tapHint: 'Tap to count',
      featTitle: 'Three things that hold a practice',
      f1t: 'Mantra counter', f1d: 'Count mantra repetitions and keep your accumulations.',
      f2t: 'Retreats', f2d: 'Create retreats and follow your daily practice and progress.',
      f3t: 'Buddhist calendar', f3d: 'See important Buddhist dates, practice days and holidays.',
      insideTitle: 'Inside',
      capHome: 'Practice', capRetreat: 'Retreat', capStats: 'Statistics', capCalendar: 'Calendar',
      stepsTitle: 'Installing — three steps',
      s1t: 'Tap “Install”', s1d: 'The browser asks you to confirm. Nothing is downloaded, no file to hunt for.',
      s2t: 'An icon appears', s2d: 'It opens like any other app, full screen. Updates arrive on their own.',
      s3t: 'Pick a language', s3d: 'On first launch the app asks for a language and offers a tour that creates your first mantra.',
      quote: 'Works offline. Your data stays on your device.',
      install: 'Install', open: 'Open', round: 'mala',
      barnote: 'No downloads, no sign-up.'
    }
  };

  var deferred = null, wasInstalled = false, saved = null;
  try { saved = localStorage.getItem('dm_site_lang'); } catch (e) {}
  var lang = saved || (/^(uk|ru)/i.test(navigator.language || '') ? 'uk' : 'en');

  function draw() {
    var t = COPY[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      el.textContent = t[el.getAttribute('data-t')];
    });
    var installed = matchMedia('(display-mode: standalone)').matches || wasInstalled;
    document.getElementById('install').textContent = installed ? t.open : t.install;
    document.getElementById('barnote').textContent = installed ? '' : t.barnote;
    document.getElementById('uk').className = lang === 'uk' ? 'on' : '';
    document.getElementById('en').className = lang === 'en' ? 'on' : '';
    tally();
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e; draw();
  });
  window.addEventListener('appinstalled', function () {
    deferred = null; wasInstalled = true; draw();
  });
  document.getElementById('install').onclick = function (e) {
    if (!deferred) return;
    e.preventDefault();
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; draw(); });
  };

  // A mala is 108 beads; the row shows 27 and fills four times per round.
  var MALA = 108, BEADS = 27, count = 0;
  var mala = document.getElementById('mala');
  for (var b = 0; b < BEADS; b++) mala.appendChild(document.createElement('i'));

  function tally() {
    document.getElementById('tallyN').textContent = count.toLocaleString(
      lang === 'uk' ? 'uk-UA' : 'en-US');
    document.getElementById('tallySub').textContent =
      COPY[lang].round + ' ' + (count % MALA) + ' / ' + MALA;
    var lit = count % BEADS === 0 && count > 0 ? BEADS : count % BEADS;
    [].forEach.call(mala.children, function (d, i) { d.className = i < lit ? 'on' : ''; });
  }

  document.getElementById('niche').addEventListener('click', function () {
    count++;
    var full = count % MALA === 0;
    try { navigator.vibrate && navigator.vibrate(full ? [140, 60, 140] : 120); } catch (e) {}
    document.getElementById('hint').style.opacity = count > 2 ? 0 : 1;
    tally();
  });

  var gallery = document.getElementById('gallery'), dots = document.getElementById('dots');
  var n = gallery.querySelectorAll('img').length;
  for (var i = 0; i < n; i++) dots.appendChild(document.createElement('i'));
  function markDot() {
    var k = Math.round(gallery.scrollLeft / (gallery.scrollWidth / n));
    [].forEach.call(dots.children, function (d, j) { d.className = j === k ? 'on' : ''; });
  }
  gallery.addEventListener('scroll', markDot, { passive: true });
  markDot();

  var lb = document.getElementById('lb');
  document.addEventListener('click', function (e) {
    if (e.target.tagName !== 'IMG' || !e.target.closest('.shot')) return;
    lb.innerHTML = '<img src="' + e.target.src + '" alt="">';
    lb.showModal();
  });
  lb.addEventListener('click', function () { lb.close(); });

  function pick(l) {
    return function () {
      lang = l;
      try { localStorage.setItem('dm_site_lang', l); } catch (e) {}
      draw();
    };
  }
  document.getElementById('uk').onclick = pick('uk');
  document.getElementById('en').onclick = pick('en');

  draw();
})();
</script>
</body>
</html>
